<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Rim Glow -->
    <radialGradient id="rimGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Tone Gradients (Warm Indian Skin Tone) -->
    <linearGradient id="skinBase" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#c98a58" />
      <stop offset="50%" stop-color="#b67341" />
      <stop offset="100%" stop-color="#9a5a29" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c4e22" />
      <stop offset="100%" stop-color="#703912" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23272e" />
      <stop offset="60%" stop-color="#12151a" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Shirt Gradient (Smart Dark Navy with Emerald stitch) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>

    <!-- Collar Accent Gradient -->
    <linearGradient id="collarAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="195" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Canvas Backdrop -->
    <rect width="400" height="400" fill="url(#bgGrad)" />
    <circle cx="200" cy="180" r="180" fill="url(#rimGlow)" />

    <!-- Ambient Subtle Tech Dots -->
    <circle cx="80" cy="100" r="2.5" fill="#34d399" opacity="0.4" />
    <circle cx="320" cy="120" r="2.5" fill="#38bdf8" opacity="0.4" />
    <circle cx="70" cy="240" r="2" fill="#34d399" opacity="0.3" />
    <circle cx="330" cy="260" r="2" fill="#38bdf8" opacity="0.3" />

    <!-- Shoulders & Body / Smart Collared Shirt -->
    <path d="M 90 400 L 90 345 C 90 305 130 280 160 270 L 200 282 L 240 270 C 270 280 310 305 310 345 L 310 400 Z" fill="url(#shirtGrad)" />
    
    <!-- Inner Shirt & Tie-less V-Neck Placket -->
    <polygon points="182,274 218,274 205,335 195,335" fill="#020617" />
    <polygon points="188,274 212,274 200,325" fill="url(#skinShadow)" />

    <!-- Left & Right Shirt Collars -->
    <polygon points="160,270 200,282 178,322 150,285" fill="#334155" />
    <polygon points="240,270 200,282 222,322 250,285" fill="#1e293b" />
    
    <!-- Subtle Emerald Collar Piping -->
    <line x1="160" y1="270" x2="178" y2="322" stroke="url(#collarAccent)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="240" y1="270" x2="222" y2="322" stroke="url(#collarAccent)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck & Jaw Shadow -->
    <polygon points="172,210 228,210 225,280 175,280" fill="url(#skinShadow)" />
    <path d="M 175 220 Q 200 248 225 220 L 220 278 Q 200 286 180 278 Z" fill="url(#skinBase)" />

    <!-- Head & Face Base Shape -->
    <path d="M 138 165 C 138 115 158 90 200 90 C 242 90 262 115 262 165 C 262 215 238 245 200 245 C 162 245 138 215 138 165 Z" fill="url(#skinBase)" />

    <!-- Ears -->
    <path d="M 134 165 C 130 152 134 140 140 142 L 142 185 C 135 185 130 178 134 165 Z" fill="url(#skinShadow)" />
    <path d="M 266 165 C 270 152 266 140 260 142 L 258 185 C 265 185 270 178 266 165 Z" fill="url(#skinShadow)" />

    <!-- Cheeks & Chin Subtle Contour -->
    <path d="M 170 230 Q 200 248 230 230 Q 200 238 170 230 Z" fill="url(#skinShadow)" opacity="0.6" />

    <!-- Hair Silhouette (Modern Styled Crop) -->
    <path d="M 135 150 C 132 105 150 72 195 70 C 240 68 268 95 265 145 C 255 142 248 130 240 120 C 220 112 180 115 160 125 C 148 132 140 142 135 150 Z" fill="url(#hairGrad)" />
    <!-- Hair Volume Top Texture -->
    <path d="M 152 88 Q 185 64 220 72 Q 252 82 258 110 C 250 102 235 96 215 94 C 185 92 165 96 152 88 Z" fill="#2d3748" opacity="0.8" />
    <path d="M 138 145 Q 148 118 172 112 Q 155 125 146 148 Z" fill="#1a202c" />
    <path d="M 262 145 Q 252 118 228 112 Q 245 125 254 148 Z" fill="#1a202c" />

    <!-- Eyebrows (Neat, Expressive) -->
    <path d="M 154 148 Q 172 142 184 147" stroke="#171923" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 216 147 Q 228 142 246 148" stroke="#171923" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Warm, Confident) -->
    <ellipse cx="170" cy="162" rx="10" ry="6.5" fill="#ffffff" />
    <circle cx="171" cy="162" r="5" fill="#1a1410" />
    <circle cx="173" cy="160" r="1.8" fill="#ffffff" />

    <ellipse cx="230" cy="162" rx="10" ry="6.5" fill="#ffffff" />
    <circle cx="229" cy="162" r="5" fill="#1a1410" />
    <circle cx="231" cy="160" r="1.8" fill="#ffffff" />

    <!-- Eyelids / Crease -->
    <path d="M 160 156 Q 170 153 180 156" stroke="#8c4e22" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 220 156 Q 230 153 240 156" stroke="#8c4e22" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 200 152 L 197 185 Q 200 190 205 187" stroke="#8c4e22" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="193" cy="188" rx="2.8" ry="1.8" fill="#703912" opacity="0.6" />
    <ellipse cx="207" cy="188" rx="2.8" ry="1.8" fill="#703912" opacity="0.6" />

    <!-- Gentle Friendly Smile -->
    <path d="M 182 210 Q 200 224 218 210" stroke="#652b0d" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 187 210 Q 200 218 213 210" fill="#ffffff" opacity="0.9" />
    <path d="M 188 221 Q 200 226 212 221" stroke="#8c4e22" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Subtle Modern Rim Lighting Accents (Emerald & Cyan Highlights) -->
    <path d="M 137 130 C 136 170 148 210 170 238" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 263 130 C 264 170 252 210 230 238" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Outer Decorative Ring -->
    <circle cx="200" cy="200" r="197" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
  </g>
</svg>
